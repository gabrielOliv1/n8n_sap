name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ── Job 1: Code Quality ──────────────────────────────────────
  quality:
    name: "Code Quality (black + ruff + mypy)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_service/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check app/ tests/

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy)
        run: mypy app/

  # ── Job 2: Tests ─────────────────────────────────────────────
  test:
    name: "Tests (pytest + coverage ≥80%)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_service/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80

  # ── Job 3: Security ─────────────────────────────────────────
  security:
    name: "Security (pip-audit + trivy + gitleaks)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_service/requirements*.txt

      - name: Install dependencies
        run: pip install -r python_service/requirements.txt -r python_service/requirements-dev.txt

      - name: Audit Python dependencies (pip-audit)
        run: pip-audit -r python_service/requirements.txt

      - name: Build Docker image
        run: docker build -t n8n-sap-python:ci ./python_service

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.70.0

      - name: Run Trivy
        run: |
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            n8n-sap-python:local

      - name: Scan for exposed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
